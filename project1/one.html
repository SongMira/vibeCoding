<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직사각형 바운싱 볼 시뮬레이션</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 메인 컨테이너 -->
  <div class="w-full max-w-3xl flex flex-col items-center">
    <!-- 헤더 -->
    <header class="text-center mb-5">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 mb-1">
        공 튕기기 시뮬레이션
      </h1>
      <p class="text-slate-400 text-sm">
        직사각형 캔버스 벽에 부딪히면 튕겨 나오는 물리 효과 애니메이션
      </p>
    </header>

    <!-- 캔버스 컨테이너 (직사각형 테두리 및 그림자) -->
    <div class="relative w-full aspect-[16/9] max-h-[460px] bg-slate-950/80 rounded-2xl border-2 border-slate-700/80 shadow-2xl overflow-hidden backdrop-blur-md">
      <canvas id="simCanvas" class="w-full h-full block cursor-pointer"></canvas>
      
      <!-- 부딪힌 횟수 카운터 배지 -->
      <div class="absolute top-3 left-3 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-300 flex items-center gap-2 shadow">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>벽 충돌 횟수: <span id="bounceCount" class="text-emerald-400 font-bold">0</span></span>
      </div>

      <!-- 공 개수 배지 -->
      <div class="absolute top-3 right-3 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-300 flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-circle text-indigo-400 text-[10px]"></i>
        <span>공 개수: <span id="ballCountDisplay" class="text-indigo-400 font-bold">1</span>개</span>
      </div>
    </div>

    <!-- 컨트롤 패널 -->
    <div class="w-full mt-5 p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        
        <!-- 속도 조절 슬라이더 -->
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-center text-sm font-semibold text-slate-300">
            <label for="speedSlider" class="flex items-center gap-1.5">
              <i class="fa-solid fa-gauge-high text-teal-400"></i> 속도 조절
            </label>
            <span id="speedValue" class="text-teal-400 font-bold">5</span>
          </div>
          <input id="speedSlider" type="range" min="1" max="15" value="5"
            class="w-full accent-teal-400 cursor-pointer h-2 bg-slate-700 rounded-lg">
        </div>

        <!-- 공 크기 조절 슬라이더 -->
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-center text-sm font-semibold text-slate-300">
            <label for="sizeSlider" class="flex items-center gap-1.5">
              <i class="fa-solid fa-up-right-and-down-left-from-center text-indigo-400"></i> 공 크기 (반경)
            </label>
            <span id="sizeValue" class="text-indigo-400 font-bold">18px</span>
          </div>
          <input id="sizeSlider" type="range" min="8" max="40" value="18"
            class="w-full accent-indigo-400 cursor-pointer h-2 bg-slate-700 rounded-lg">
        </div>
      </div>

      <!-- 제어 버튼 목록 -->
      <div class="flex flex-wrap items-center justify-center gap-3 pt-2 border-t border-slate-700/60">
        <!-- 재생 / 일시정지 -->
        <button id="playPauseBtn"
          class="flex items-center gap-2 px-4 py-2.5 bg-teal-500 hover:bg-teal-400 active:scale-95 text-slate-950 font-bold rounded-xl transition duration-150 shadow-md">
          <i id="playIcon" class="fa-solid fa-pause"></i>
          <span id="playText">일시정지</span>
        </button>

        <!-- 공 추가 -->
        <button id="addBallBtn"
          class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold rounded-xl transition duration-150 shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span>공 추가</span>
        </button>

        <!-- 초기화 (리셋) -->
        <button id="resetBtn"
          class="flex items-center gap-2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 font-semibold rounded-xl transition duration-150 shadow-md">
          <i class="fa-solid fa-rotate-left"></i>
          <span>초기화</span>
        </button>
      </div>
      
      <p class="text-center text-xs text-slate-400 mt-4">
        💡 캔버스 내부를 클릭해도 해당 위치에 새로운 공이 생성됩니다!
      </p>
    </div>
  </div>

  <!-- 시뮬레이션 스크립트 -->
  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI 요소
    const bounceCountEl = document.getElementById('bounceCount');
    const ballCountDisplay = document.getElementById('ballCountDisplay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const resetBtn = document.getElementById('resetBtn');
    const addBallBtn = document.getElementById('addBallBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');

    // 시뮬레이션 변수
    let isRunning = true;
    let totalBounces = 0;
    let baseSpeed = Number(speedSlider.value);
    let defaultRadius = Number(sizeSlider.value);
    let balls = [];

    // 생생한 공 색상 팔레트
    const colors = [
      { main: '#2dd4bf', glow: 'rgba(45, 212, 191, 0.4)' }, // Teal
      { main: '#818cf8', glow: 'rgba(129, 140, 248, 0.4)' }, // Indigo
      { main: '#f43f5e', glow: 'rgba(244, 63, 94, 0.4)' },   // Rose
      { main: '#fbbf24', glow: 'rgba(251, 191, 36, 0.4)' },  // Amber
      { main: '#a855f7', glow: 'rgba(168, 85, 247, 0.4)' },  // Purple
      { main: '#38bdf8', glow: 'rgba(56, 189, 248, 0.4)' },  // Sky
      { main: '#4ade80', glow: 'rgba(74, 222, 128, 0.4)' }   // Green
    ];

    // 캔버스 크기 동적 조절
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      // 디바이스 픽셀 비율(HiDPI)을 고려하여 선명하게 렌더링
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    // 공 클래스 정의
    class Ball {
      constructor(x, y, radius, speedMultiplier) {
        this.radius = radius;
        // 위치 (캔버스 경계 내 보정)
        const logicalW = canvas.getBoundingClientRect().width;
        const logicalH = canvas.getBoundingClientRect().height;

        this.x = x ?? Math.max(radius, Math.min(logicalW - radius, logicalW / 2));
        this.y = y ?? Math.max(radius, Math.min(logicalH - radius, logicalH / 2));

        // 랜덤 각도로 이동 방향 결정
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speedMultiplier;
        this.vy = Math.sin(angle) * speedMultiplier;

        // 랜덤 색상 할당
        const colorObj = colors[Math.floor(Math.random() * colors.length)];
        this.color = colorObj.main;
        this.glow = colorObj.glow;
      }

      update(width, height) {
        this.x += this.vx;
        this.y += this.vy;

        let bounced = false;

        // 좌/우 벽 충돌 검사
        if (this.x - this.radius <= 0) {
          this.x = this.radius;
          this.vx = -this.vx;
          bounced = true;
        } else if (this.x + this.radius >= width) {
          this.x = width - this.radius;
          this.vx = -this.vx;
          bounced = true;
        }

        // 상/하 벽 충돌 검사
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.vy = -this.vy;
          bounced = true;
        } else if (this.y + this.radius >= height) {
          this.y = height - this.radius;
          this.vy = -this.vy;
          bounced = true;
        }

        if (bounced) {
          totalBounces++;
          bounceCountEl.textContent = totalBounces;
        }
      }

      draw(context) {
        context.save();
        
        // 은은한 글로우(네온) 효과
        context.shadowColor = this.glow;
        context.shadowBlur = 12;

        // 볼 본체 그리기
        context.beginPath();
        context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        context.fillStyle = this.color;
        context.fill();
        context.closePath();

        // 3D 구체 느낌의 하이라이트(광택) 추가
        context.beginPath();
        context.arc(
          this.x - this.radius * 0.3,
          this.y - this.radius * 0.3,
          this.radius * 0.28,
          0,
          Math.PI * 2
        );
        context.fillStyle = 'rgba(255, 255, 255, 0.45)';
        context.fill();
        context.closePath();

        context.restore();
      }

      setSpeed(newSpeed) {
        const currentSpeed = Math.hypot(this.vx, this.vy) || 1;
        this.vx = (this.vx / currentSpeed) * newSpeed;
        this.vy = (this.vy / currentSpeed) * newSpeed;
      }
    }

    // 초기 상태로 설정
    function init() {
      resizeCanvas();
      balls = [];
      totalBounces = 0;
      bounceCountEl.textContent = '0';

      const rect = canvas.getBoundingClientRect();
      balls.push(new Ball(rect.width / 2, rect.height / 2, defaultRadius, baseSpeed));
      updateBallCountUI();
    }

    function updateBallCountUI() {
      ballCountDisplay.textContent = balls.length;
    }

    // 애니메이션 메인 루프
    function animate() {
      if (isRunning) {
        const rect = canvas.getBoundingClientRect();
        
        // 이전 프레임 잔상을 살짝 남기며 지우기 (모션 블러 효과)
        ctx.fillStyle = 'rgba(2, 6, 23, 0.28)';
        ctx.fillRect(0, 0, rect.width, rect.height);

        // 모든 공 업데이트 및 그리기
        for (const ball of balls) {
          ball.update(rect.width, rect.height);
          ball.draw(ctx);
        }
      }
      requestAnimationFrame(animate);
    }

    // 이벤트 리스너 등록
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // 재생 / 일시정지 토글
    playPauseBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        playIcon.className = 'fa-solid fa-pause';
        playText.textContent = '일시정지';
        playPauseBtn.className = playPauseBtn.className.replace('bg-emerald-500', 'bg-teal-500');
      } else {
        playIcon.className = 'fa-solid fa-play';
        playText.textContent = '계속 재생';
        playPauseBtn.className = playPauseBtn.className.replace('bg-teal-500', 'bg-emerald-500');
      }
    });

    // 리셋 버튼
    resetBtn.addEventListener('click', () => {
      init();
    });

    // 공 추가 버튼
    addBallBtn.addEventListener('click', () => {
      const rect = canvas.getBoundingClientRect();
      balls.push(new Ball(null, null, defaultRadius, baseSpeed));
      updateBallCountUI();
    });

    // 캔버스 클릭 시 해당 위치에 공 생성
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      balls.push(new Ball(clickX, clickY, defaultRadius, baseSpeed));
      updateBallCountUI();
    });

    // 속도 조절 슬라이더
    speedSlider.addEventListener('input', (e) => {
      baseSpeed = Number(e.target.value);
      speedValue.textContent = baseSpeed;
      balls.forEach(ball => ball.setSpeed(baseSpeed));
    });

    // 크기 조절 슬라이더
    sizeSlider.addEventListener('input', (e) => {
      defaultRadius = Number(e.target.value);
      sizeValue.textContent = `${defaultRadius}px`;
      balls.forEach(ball => {
        ball.radius = defaultRadius;
      });
    });

    // 페이지 로드 시 실행
    window.onload = function () {
      init();
      animate();
    };
  </script>
</body>
</html>
