<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>형성평가 제출 결과 CSV 다운로드</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f1f5f9;margin:0}
    .card{background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);text-align:center;max-width:480px;width:90%}
    button{background:#2563eb;color:#fff;border:none;padding:14px 24px;font-size:1rem;font-weight:700;border-radius:8px;cursor:pointer;margin-top:16px}
    button:hover{background:#1d4ed8} button:disabled{background:#94a3b8;cursor:not-allowed}
    #status{margin-top:16px;font-size:.95rem;color:#334155;line-height:1.5;word-break:keep-all}
    .error-box{color:#dc2626;background:#fee2e2;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-top:14px;text-align:left;font-size:.88rem}
  </style>
</head>
<body>
  <div class="card">
    <h2>형성평가 응답 데이터 관리자</h2>
    <p>Firestore에 저장된 학생들의 제출 데이터를 CSV 파일로 추출합니다.</p>
    <button id="downloadBtn">CSV로 다운로드</button>
    <div id="status"></div>
  </div>

  <script type="module">
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const showError = (title, detail) => {
      status.innerHTML = `<div class="error-box"><strong>${title}</strong><br>${detail}</div>`;
    };

    let db, collection, getDocs;
    try {
      // SDK는 동적 import로 불러와 로딩 실패도 화면에 표시
      const appMod = await import("https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js");
      const fsMod = await import("https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js");
      ({ collection, getDocs } = fsMod);
      const app = appMod.initializeApp({
        apiKey: "AIzaSyAXHn1inKIYq5ejWUgZHj_t2jmrZzPExHo",
        authDomain: "test-e3a4a.firebaseapp.com",
        projectId: "test-e3a4a",
        storageBucket: "test-e3a4a.firebasestorage.app",
        messagingSenderId: "783338136920",
        appId: "1:783338136920:web:7e8f39e54d27ddacd7712d",
        measurementId: "G-WR0895B8W8"
      });
      db = fsMod.getFirestore(app);
    } catch (e) {
      console.error(e);
      showError('Firebase SDK 로딩 실패', '인터넷 연결 또는 네트워크 차단(학교 방화벽 등)을 확인하세요.<br>' + e.message);
      downloadBtn.disabled = true;
    }

    const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      status.textContent = '데이터를 불러오는 중...';
      try {
        const snap = await getDocs(collection(db, "submissions"));
        if (snap.empty) {
          status.innerHTML = '<span style="color:#eab308;font-weight:bold;">⚠️ 저장된 응답 데이터가 0건입니다.</span><br>four.html에서 제출한 뒤 다시 시도하세요.';
          return;
        }
        const list = snap.docs.map(d => d.data());
        const ms = x => x?.submittedAt?.toMillis ? x.submittedAt.toMillis() : 0;
        list.sort((a, b) => ms(a) - ms(b));

        const rows = [["제출일시","관리번호","이름","1번(객관식)","2번(단답)","3번(서술)"]];
        list.forEach(data => {
          const t = data.submittedAt?.toDate ? data.submittedAt.toDate().toLocaleString('ko-KR') : '';
          rows.push([t, data.studentId, data.studentName, data.answers?.q1, data.answers?.q2, data.answers?.q3]);
        });
        const csv = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `형성평가_결과_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        status.innerHTML = `<span style="color:#16a34a;font-weight:bold;">✔ 총 ${snap.size}명의 응답 데이터가 다운로드되었습니다.</span>`;
      } catch (error) {
        console.error("다운로드 에러:", error);
        const hints = {
          'permission-denied': 'Firestore 보안 규칙에서 submissions 읽기(read)가 허용되지 않았습니다. Firebase 콘솔 → Firestore → 규칙을 확인하세요.',
          'failed-precondition': 'Firestore 데이터베이스가 아직 생성되지 않았거나 설정이 필요합니다. 콘솔에서 데이터베이스를 만드세요.',
          'unavailable': '네트워크 연결 문제로 Firestore에 접속할 수 없습니다.',
          'not-found': 'Firestore 데이터베이스(default)를 찾을 수 없습니다. 콘솔에서 생성했는지 확인하세요.'
        };
        showError(`다운로드 실패 (${error.code || 'unknown'})`, (hints[error.code] || '') + '<br>' + error.message);
      } finally {
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
