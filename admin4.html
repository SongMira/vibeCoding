<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>형성평가 제출 결과 CSV 다운로드</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f1f5f9;
      margin: 0;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.5;
      word-break: keep-all;
    }
    .error-box {
      color: #dc2626;
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
      text-align: left;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>형성평가 응답 데이터 관리자</h2>
    <p>Firestore에 저장된 학생들의 제출 데이터를 CSV 파일로 추출합니다.</p>
    <button id="downloadBtn">CSV로 다운로드</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXHn1inKIYq5ejWUgZHj_t2jmrZzPExHo",
      authDomain: "test-e3a4a.firebaseapp.com",
      projectId: "test-e3a4a",
      storageBucket: "test-e3a4a.firebasestorage.app",
      messagingSenderId: "783338136920",
      appId: "1:783338136920:web:7e8f39e54d27ddacd7712d",
      measurementId: "G-WR0895B8W8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      status.innerHTML = '데이터를 불러오는 중...';

      try {
        const querySnapshot = await getDocs(collection(db, "submissions"));

        if (querySnapshot.empty) {
          status.innerHTML = '<span style="color: #eab308; font-weight: bold;">⚠️ 저장된 응답 데이터가 0건입니다.</span><br>four.html에서 문제를 푼 뒤 제출해 보세요.';
          downloadBtn.disabled = false;
          return;
        }

        // CSV 헤더 정의
        const headers = ["제출일시", "관리번호", "이름", "1번(객관식)", "2번(단답)", "3번(서술)"];
        const rows = [headers];

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          let submittedAt = '';
          if (data.submittedAt && data.submittedAt.toDate) {
            submittedAt = data.submittedAt.toDate().toLocaleString('ko-KR');
          }
          const studentId = data.studentId || '';
          const studentName = data.studentName || '';
          const q1 = data.answers?.q1 || '';
          const q2 = data.answers?.q2 || '';
          const q3 = (data.answers?.q3 || '').replace(/"/g, '""');

          rows.push([
            `"${submittedAt}"`,
            `"${studentId}"`,
            `"${studentName}"`,
            `"${q1}"`,
            `"${q2}"`,
            `"${q3}"`
          ]);
        });

        // CSV 다운로드 (UTF-8 BOM 포함)
        const csvContent = '\uFEFF' + rows.map(e => e.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `형성평가_결과_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        status.innerHTML = `<span style="color: #16a34a; font-weight: bold;">✔ 총 ${querySnapshot.size}명의 응답 데이터가 다운로드되었습니다.</span>`;
      } catch (error) {
        console.error("다운로드 에러:", error);
        let errorMsg = error.message;
        if (error.code === 'permission-denied') {
          errorMsg = '파이어스토어 보안 규칙에서 읽기 권한(read)이 허용되지 않았습니다. Firebase 콘솔의 규칙을 확인해 주세요.';
        }
        status.innerHTML = `
          <div class="error-box">
            <strong>다운로드 실패 오류:</strong><br>${errorMsg}
          </div>
        `;
      } finally {
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
